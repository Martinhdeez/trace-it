name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # the challenge data the golden tests run on
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --locked
      # Lint, format, unit tests, then golden + API flow on a fresh test database.
      # LLM tests (`-m llm`) are never run here.
      - name: make check
        run: make check
