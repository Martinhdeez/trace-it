name: CI

on:
  pull_request:
    branches: [dev, main, integration]
  push:
    branches: [dev, integration]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # the challenge data the golden tests run on
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --locked
      # Lint, format, unit tests, then golden + API flow on a fresh test database.
      # LLM tests (`-m llm`) are never run here.
      - name: make check
        run: make check

  # The demo path through the real console and API in Chromium (tests/integration/README.md).
  e2e-integration:
    # PRs into integration, and every push to it (a merge), so "integration is green" holds.
    if: github.base_ref == 'integration' || github.ref == 'refs/heads/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/integration/package-lock.json
      - name: OCR weights
        uses: actions/cache@v4
        with:
          path: .models
          key: ocr-models-${{ hashFiles('backend/app/features/ingestion/tools/download_models.py') }}
      - name: Install
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci)
          (cd tests/integration && npm ci && npx playwright install --with-deps chromium)
      - name: make e2e-integration
        run: make e2e-integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/integration/test-results
