name: Ingestion checks

on:
  push:
    branches: [data-ingestion, 'feat/**', 'fix/**']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.10'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run pytest -q app/features/ingestion/tests app/features/sources/tests
          --ignore=app/features/sources/tests/test_erp_sync.py
          -m "not ocr and not integration"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace_ingestion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trace -d trace_ingestion_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TRACE_DATABASE_URL: postgresql+psycopg://trace:trace@localhost:5432/trace_ingestion_test
      TRACEPAY_TEST_POSTGRES: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.10.10'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -q app/features/ingestion/tests/test_process_api.py
