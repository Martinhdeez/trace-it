<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trace.it · Pago de facturas</title>
    <meta
      name="description"
      content="Escribes las reglas de pago en una frase y el programa decide cada factura con ellas. Cada decisión guarda su regla, su dato y su versión de la norma. Lo que no cuadra sube a tu bandeja."
    />
    <script>
      try {
        if (localStorage.getItem('trace.tema') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
