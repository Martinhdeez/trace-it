# Inside the existing gex-dashboard.hopto.org block, before its /nexia/* catch-all.
# Preserve the prefix: do not use handle_path for trace-it.
redir /nexia/trace-it /nexia/trace-it/ 308
handle /nexia/trace-it/* {
    reverse_proxy 127.0.0.1:18173
}

# Synthetic, unauthenticated data only. The service remains bound to VPS loopback.
redir /nexia/criminal-records /nexia/criminal-records/ 308
handle /nexia/criminal-records/* {
    reverse_proxy 127.0.0.1:18010
}
