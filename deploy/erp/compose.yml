name: trace-it-erp
services:
  erp:
    build: .
    image: trace-it-erp:challenge
    ports: ["127.0.0.1:${TRACE_ERP_PORT:-18009}:8009"]
    networks:
      trace: {aliases: [erp]}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: [CMD, python, -S, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1', 8009, timeout=3); c.request('GET', '/erp/estado'); assert c.getresponse().status == 200"]
      interval: 10s
      timeout: 15s
      start_period: 10s
      retries: 3
networks:
  trace:
    external: true
    name: ${TRACE_ERP_NETWORK:-trace-it_default}
