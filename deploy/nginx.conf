server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    # Public demo console; the backend still validates Bearer and mailbox tokens.
    auth_basic off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Only reachable on the loopback listener/container network, outside Caddy's route.
    location = /internal-health {
        auth_basic off;
        proxy_pass http://backend:8000/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /nexia/trace-it { return 308 /nexia/trace-it/; }
    # Public API documentation.
    location ~ ^/nexia/trace-it/api/(docs|redoc|openapi\.json|guide|docs/oauth2-redirect)$ {
        auth_basic off;
        rewrite ^/nexia/trace-it/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /nexia/trace-it/api/ {
        # Browser identity is automatic; /db remains Bearer-only in the backend.
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location /nexia/trace-it/assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /nexia/trace-it/ {
        try_files $uri /nexia/trace-it/index.html;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }
}
