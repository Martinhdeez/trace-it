map $http_authorization $trace_auth_realm {
    default "trace-it";
    "~*^Bearer\\s+" off;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    # Refresh Docker DNS when the API container is replaced, without restarting this gateway.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $trace_backend backend:8000;
    proxy_connect_timeout 3s;
    # Preserve errors returned by the API; only gateway failures use this fallback.
    proxy_intercept_errors off;
    error_page 502 504 =503 @maintenance;
    auth_basic "trace-it";
    auth_basic_user_file /etc/nginx/trace-it.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Only reachable on the loopback listener/container network, outside Caddy's route.
    location = /internal-health {
        auth_basic off;
        proxy_pass http://$trace_backend/ready;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /nexia/trace-it { return 308 /nexia/trace-it/; }
    # Public documentation only. Every data endpoint still authenticates.
    location ~ ^/nexia/trace-it/api/(docs|redoc|openapi\.json|guide|docs/oauth2-redirect)$ {
        auth_basic off;
        rewrite ^/nexia/trace-it/api/(.*)$ /$1 break;
        proxy_pass http://$trace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /nexia/trace-it/api/ {
        # Only Bearer requests bypass Basic; the backend validates their token.
        auth_basic $trace_auth_realm;
        rewrite ^/nexia/trace-it/api/(.*)$ /$1 break;
        proxy_pass http://$trace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location /nexia/trace-it/assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /nexia/trace-it/ {
        try_files $uri /nexia/trace-it/index.html;
        add_header Cache-Control "no-store";
    }
    location @maintenance {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"code":"maintenance","message":"Servicio temporalmente no disponible. Vuelve a intentarlo en unos instantes."}';
    }
    location / { return 404; }
}
