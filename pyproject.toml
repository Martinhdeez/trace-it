[project]
name = "trace-pay"
version = "0.1.0"
description = "Evidence-preserving, staged invoice and workbook extraction API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "openpyxl>=3.1.5,<4",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "huggingface-hub>=1.0,<2",
  "pyyaml>=6,<7",
  "filelock>=3.16,<5",
  "fal-client>=0.10,<1",
  "python-dotenv>=1,<2",
  "numpy>=2,<3",
  "opencv-python>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/tracepay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against the official local material", "ocr: requires downloaded OCR weights"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
