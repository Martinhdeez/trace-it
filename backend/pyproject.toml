[project]
name = "trace-it-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pydantic-ai-slim[anthropic,google,openai]>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.10,<3",
    "pymupdf>=1.25,<2",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.20,<2",
    "pillow>=11,<13",
    "huggingface-hub>=1.0,<2",
    "pyyaml>=6,<7",
    "filelock>=3.16,<5",
    "fal-client>=0.10,<1",
    "python-dotenv>=1,<2",
    "numpy>=2,<3",
    "opencv-python>=4.11,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "tests", "evals"]
addopts = "-m 'not llm'"
markers = [
    "e2e: end to end against the challenge data (golden outcomes, API flow with the database)",
    "llm: calls real LLM providers; opt-in with `make eval-compiler`",
    "integration: requires official local material",
    "ocr: requires downloaded OCR weights",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
